<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Server Panel</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.5.0/css/xterm.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="login" class="screen">
  <div class="login-box">
    <h1>🔐 Server Panel</h1>
    <input id="tokenInput" type="password" placeholder="Token d'accès" autocomplete="off" />
    <button id="loginBtn">Entrer</button>
    <p id="loginError" class="error"></p>
  </div>
</div>

<div id="app" class="screen hidden">
  <nav class="tabbar">
    <button class="tab active" data-tab="terminal">Terminal</button>
    <button class="tab" data-tab="files">Fichiers</button>
    <button class="tab" data-tab="services">Services</button>
    <button class="tab" data-tab="logs">Logs</button>
  </nav>

  <section id="tab-terminal" class="tab-content active">
    <div id="terminal"></div>
  </section>

  <section id="tab-files" class="tab-content">
    <div class="toolbar">
      <span id="filesPath">/</span>
      <label class="upload-btn">📤 Upload<input id="uploadInput" type="file" hidden /></label>
    </div>
    <ul id="filesList"></ul>
  </section>

  <section id="tab-services" class="tab-content">
    <ul id="servicesList"></ul>
  </section>

  <section id="tab-logs" class="tab-content">
    <input id="logUnit" placeholder="nom-du-service.service (vide = tous les logs)" />
    <pre id="logsOutput"></pre>
  </section>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.5.0/xterm.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xterm/5.5.0/addon-fit/xterm-addon-fit.min.js"></script>
<script src="app.js"></script>
</body>
</html>
